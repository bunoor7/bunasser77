# Checks the plugin on every push, and on a published release builds bunasser77.plugin
# and attaches it to that release. Replaces the npm template (the repo has no package.json).
#
# To release: bump .claude-plugin/plugin.json, push, then create a release whose tag is
# v<version> (for example v1.14.0). The job refuses a tag that does not match the version.
#
# The archive is built once in the validate job and checked there: every file the repo
# ships must be inside it. An exclusion that is too wide silently drops shipped files,
# which is how real-sfx lost its 936 UI sounds to '*/node_modules/*' while its own
# config.json kept pointing at them.

name: Plugin

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests and skills
        run: python .github/scripts/validate_plugin.py
      - name: Build bunasser77.plugin
        run: |
          mkdir -p dist
          zip -qr dist/bunasser77.plugin . -x '.git/*' '.github/*' 'dist/*' '*/__pycache__/*' '*.DS_Store'
          ls -l dist/bunasser77.plugin
      - name: Check the package holds every shipped file
        run: python .github/scripts/validate_plugin.py --package dist/bunasser77.plugin
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: bunasser77.plugin
          path: dist/bunasser77.plugin

  package:
    needs: validate
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the package built by the validate job
        uses: actions/download-artifact@v4
        with:
          name: bunasser77.plugin
          path: dist
      - name: Check tag matches plugin version
        if: github.event_name == 'release'
        run: python .github/scripts/validate_plugin.py --tag "${{ github.event.release.tag_name }}"
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/bunasser77.plugin --clobber
